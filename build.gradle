plugins {
    id 'java'
}

group = 'fr.romitou.battletournaments'
version = '1.0.0'
description = 'High-performance tournament and arena duel system for PaperMC'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(17)
}

repositories {
    mavenCentral()
    maven { url = uri("https://repo.papermc.io/repository/maven-public/") }
    maven { url = uri("https://mvn.intellectualsites.co.nz/content/repositories/releases/") }
}

dependencies {
    compileOnly('com.fastasyncworldedit:FastAsyncWorldEdit-Core:2.1.2')
    compileOnly("io.papermc.paper:paper-api:1.18.2-R0.1-SNAPSHOT")
    implementation("org.mongodb:mongodb-driver-sync:4.6.0")
}
